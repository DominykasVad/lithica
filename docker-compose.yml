## Example Docker Compose configuration
##
## Use this as a template to set up docker compose, or as guide to set up other
## orchestration services
services:

  server:
    build:
      context: ./server
    ## To use a published release image instead of building, comment out
    ## "build" above and set a release tag here:
    #image: ghcr.io/dominykasvad/lithica-server:v0.3.0
    depends_on:
      - sql
    environment:
      ## These should be the names of the dependent containers listed below,
      ## or FQDNs/IP addresses if these services are running outside of Docker
      POSTGRES_HOST: sql
      ## Credentials for database:
      POSTGRES_USER:
      POSTGRES_PASSWORD:
      ## Commented Values are Default:
      #POSTGRES_DB: defaults to same as POSTGRES_USER
      #POSTGRES_PORT: 5432
      #LOG_SQL: 0 (1 for verbose SQL logs)
      THREADS:
      WORKERS:
      #HOST: "::" (IPv4 and IPv6; "0.0.0.0" where IPv6 is disabled)
      ## Optional modules to switch on, comma-separated. When set, it
      ## replaces "modules" of config.yaml:
      #MODULES: cards
      ## Signed file links (README, "Signed file links"): the same secret
      ## for the server and the client, from FILE_LINK_SECRET in .env.
      ## Empty or unset: file links are not signed.
      FILE_LINK_SECRET: ${FILE_LINK_SECRET:-}
    volumes:
      - "${MOUNT_DATA}:/data"
      - "./server/config.yaml:/opt/app/config.yaml"

  ## The web client, Sardonyx: nginx serving the app and passing /api/ on
  ## to the server. It is served at the root of its host; it has no base
  ## path (BASE_URL is the legacy client's).
  client:
    build:
      context: ./clients/sardonyx
      target: release
      args:
        BUILD_INFO: ${BUILD_INFO:-latest}
    ## Published release image, as for the server:
    #image: ghcr.io/dominykasvad/lithica-client:v0.3.0
    depends_on:
      - server
    environment:
      BACKEND_HOST: server
      FILE_LINK_SECRET: ${FILE_LINK_SECRET:-}
    volumes:
      - "${MOUNT_DATA}:/data:ro"
    ports:
      - "${PORT}:80"

  ## The legacy web client, optional: started only with the "legacy"
  ## profile (docker compose --profile legacy up -d, or COMPOSE_PROFILES=legacy
  ## in .env), on LEGACY_PORT. It is the one that can serve the site under a
  ## path (BASE_URL), and the one with pools, comments and user pages.
  client-legacy:
    profiles: [legacy]
    build:
      context: ./legacy/client
      args:
        BUILD_INFO: ${BUILD_INFO:-latest}
    ## Published release image:
    #image: ghcr.io/dominykasvad/lithica-client-legacy:v0.3.0
    depends_on:
      - server
    environment:
      BACKEND_HOST: server
      BASE_URL:
      FILE_LINK_SECRET: ${FILE_LINK_SECRET:-}
    volumes:
      - "${MOUNT_DATA}:/data:ro"
    ports:
      - "${LEGACY_PORT:-8081}:80"

  sql:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER:
      POSTGRES_PASSWORD:
    volumes:
      - "${MOUNT_SQL}:/var/lib/postgresql/data"
