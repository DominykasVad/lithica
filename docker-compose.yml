## Example Docker Compose configuration
##
## Use this as a template to set up docker compose, or as guide to set up other
## orchestration services
services:

  server:
    build:
      context: ./server
    ## To use a published release image instead of building, comment out
    ## "build" above and set a release tag here:
    #image: ghcr.io/dominykasvad/lithica-server:v0.1.0
    depends_on:
      - sql
    environment:
      ## These should be the names of the dependent containers listed below,
      ## or FQDNs/IP addresses if these services are running outside of Docker
      POSTGRES_HOST: sql
      ## Credentials for database:
      POSTGRES_USER:
      POSTGRES_PASSWORD:
      ## Commented Values are Default:
      #POSTGRES_DB: defaults to same as POSTGRES_USER
      #POSTGRES_PORT: 5432
      #LOG_SQL: 0 (1 for verbose SQL logs)
      THREADS:
      WORKERS:
    volumes:
      - "${MOUNT_DATA}:/data"
      - "./server/config.yaml:/opt/app/config.yaml"

  client:
    build:
      context: ./legacy/client
      args:
        BUILD_INFO: ${BUILD_INFO:-latest}
    ## Published release image, as for the server:
    #image: ghcr.io/dominykasvad/lithica-client-legacy:v0.1.0
    depends_on:
      - server
    environment:
      BACKEND_HOST: server
      BASE_URL:
    volumes:
      - "${MOUNT_DATA}:/data:ro"
    ports:
      - "${PORT}:80"

  sql:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER:
      POSTGRES_PASSWORD:
    volumes:
      - "${MOUNT_SQL}:/var/lib/postgresql/data"
