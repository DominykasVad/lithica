## Docker Compose configuration for dev iteration
##
## Data is transient by using named vols.
## Run: docker-compose -f ./docker-compose.dev.yml up
## Needs server/config.yaml with your own "secret"; the server refuses to
## start with the default one.
services:

  server:
    build:
      context: ./server
      target: development
    depends_on:
      - sql
    environment:
      ## These should be the names of the dependent containers listed below,
      ## or FQDNs/IP addresses if these services are running outside of Docker
      POSTGRES_HOST: sql
      ## Credentials for database:
      POSTGRES_USER:
      POSTGRES_PASSWORD:
      ## Commented Values are Default:
      #POSTGRES_DB: defaults to same as POSTGRES_USER
      #POSTGRES_PORT: 5432
      #LOG_SQL: 0 (1 for verbose SQL logs)
      THREADS:
      ## the dev stack runs with the modules on, Sardonyx's card pages among
      ## what it serves; set to "" here to try the engine alone
      MODULES: cards
      ## signed file links (README): the same secret for the server and both
      ## clients, from FILE_LINK_SECRET in .env; empty: not signed
      FILE_LINK_SECRET: ${FILE_LINK_SECRET:-}
      #HOST: "::" (IPv4 and IPv6; "0.0.0.0" where IPv6 is disabled)
    volumes:
      - "data:/data"
      - "./server/:/opt/app/"

  client:
    build:
      context: ./legacy/client
      target: development
    depends_on:
      - server
    environment:
      FILE_LINK_SECRET: ${FILE_LINK_SECRET:-}
    volumes:
      - "data:/data:ro"
      - "./legacy/client/:/opt/app/"
      - "/opt/app/public/"
    ports:
      - "${PORT}:80"
      - "8081:8081"

  # Sardonyx, the new client, as its image serves it: on port 8082 (or
  # SARDONYX_PORT). Rebuild it after a change; `pnpm dev` in
  # clients/sardonyx is the quicker way to work on it.
  sardonyx:
    build:
      context: ./clients/sardonyx
      target: release
    depends_on:
      - server
    environment:
      FILE_LINK_SECRET: ${FILE_LINK_SECRET:-}
    volumes:
      - "data:/data:ro"
    ports:
      - "${SARDONYX_PORT:-8082}:80"

  sql:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER:
      POSTGRES_PASSWORD:
    volumes:
      - "sql:/var/lib/postgresql/data"

volumes:
  data:
  sql:
