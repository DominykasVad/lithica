[project]
name = "lithica"
version = "0.1.0.dev0"
description = "Self-hosted image board (booru) engine; a fork of szurubooru"
readme = "../README.md"
license = "GPL-3.0-only"
requires-python = ">=3.13,<3.14"
dependencies = [
    "alembic>=1.20.0",
    "certifi>=2026.7.22",
    "coloredlogs>=15.0.1",
    "numpy>=2.5.3",
    "pillow>=12.3.0",
    "pillow-avif-plugin>=1.6.0",
    "pillow-heif>=1.8.0",
    "psycopg2-binary>=2.9.13",
    "pynacl>=1.6.2",
    "pyrfc3339>=2.1.0",
    "python-multipart>=0.0.32",
    "pytz>=2026.5",
    "pyyaml>=6.0.3",
    "sqlalchemy>=2.0.40,<2.1",
    "waitress>=3.0.2",
    "yt-dlp>=2026.8.19",
]

[build-system]
requires = ["uv_build>=0.13.0,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "lithica"
module-root = ""

[tool.pytest.ini_options]
testpaths = ["lithica"]

[tool.black]
line-length = 79

[tool.isort]
known_first_party = ["lithica"]
known_third_party = ["PIL", "alembic", "coloredlogs", "freezegun", "nacl", "numpy", "pyrfc3339", "pytest", "pytz", "sqlalchemy", "yaml", "youtube_dl"]
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true

[dependency-groups]
dev = []
