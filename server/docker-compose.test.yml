## PostgreSQL for the test suite. Data lives in memory and is thrown away.
## Run: docker compose -f docker-compose.test.yml up -d --wait
name: lithica-test

services:

  db:
    image: postgres:17
    command: >
      postgres
      -c fsync=off
      -c synchronous_commit=off
      -c full_page_writes=off
      -c TimeZone=UTC
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    tmpfs:
      - /var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 1s
      timeout: 3s
      retries: 30
