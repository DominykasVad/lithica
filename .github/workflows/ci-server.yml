name: CI (server)

# When the server's checks run: on a pull request that is ready for review
# and on main, and only when something they look at has changed. A branch
# that is pushed without a pull request is not checked, and a change of the
# documentation or of a client alone does not run them.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "server/**"
      - "doc/openapi.json"
      - ".github/workflows/ci-server.yml"
      # the web servers that check the file links the server signs
      # (lithica/tests/test_file_links_nginx.py)
      - "clients/sardonyx/nginx.conf.template"
      - "clients/sardonyx/docker-entrypoint.d/**"
      - "legacy/client/nginx.conf.docker"
      - "legacy/client/docker-start.sh"
  push:
    branches: [main]
    paths:
      - "server/**"
      - "doc/openapi.json"
      - ".github/workflows/ci-server.yml"
      # the web servers that check the file links the server signs
      # (lithica/tests/test_file_links_nginx.py)
      - "clients/sardonyx/nginx.conf.template"
      - "clients/sardonyx/docker-entrypoint.d/**"
      - "legacy/client/nginx.conf.docker"
      - "legacy/client/docker-start.sh"

permissions:
  contents: read

concurrency:
  group: ci-server-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server:
    name: Server (lint, types, tests)
    # Not for a draft: it is checked when it is marked ready for review. A
    # push to main has no pull request, so this is true for it.
    if: github.event.pull_request.draft != true
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30

    env:
      LITHICA_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5433/postgres
      # the runner has Docker: the nginx checks of signed file links must
      # run here, not be skipped
      LITHICA_REQUIRE_DOCKER: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.0
        with:
          enable-cache: true
          cache-dependency-glob: server/uv.lock

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Install dependencies
        run: uv sync --frozen

      - name: Lint
        run: uv run ruff check --output-format=github .

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Type check
        run: uv run pyright

      # No raw SQL and nothing PostgreSQL-only in the engine (AGENTS.md,
      # "Database"). Also part of the suite; run first so it is visible.
      - name: Database portability gate
        run: uv run pytest --color=yes lithica/tests/test_portability.py

      # The engine never imports a module and modules never import each other
      # (AGENTS.md, "Modules"). Also part of the suite; run first so that the
      # offending import is shown.
      - name: Module boundary
        run: uv run lint-imports

      # The tests build their tables from the models; a real database is built
      # by the migrations. This fails when the two describe different schemas.
      # It migrates the service's own "postgres" database, which nothing else
      # uses: the tests create a database per worker.
      - name: Migrations match the models
        run: |
          printf 'database: %s\ndata_dir: %s\n' \
            "$LITHICA_TEST_DATABASE_URL" "$RUNNER_TEMP/data" > config.yaml
          uv run alembic upgrade head
          uv run alembic check
          rm config.yaml

      # doc/openapi.json is generated from the code and is the API contract.
      # It has the routes of every module in lithica/modules, whatever is
      # switched on here.
      # Also part of the suite; run first so that the difference is shown.
      - name: OpenAPI contract is up to date
        run: uv run python -m lithica.openapi | diff -u ../doc/openapi.json -

      - name: Test
        run: uv run pytest -n auto --color=yes
