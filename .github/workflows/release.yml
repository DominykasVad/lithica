name: Release
on:
  release:
    types: [published]
  # Manual runs build both images for both architectures without pushing,
  # so the workflow can be tested without publishing anything.
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  images:
    name: Build ${{ matrix.image }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: lithica-server
            context: ./server
          - image: lithica-client-legacy
            context: ./legacy/client

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        if: github.event_name == 'release'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Image tag = release tag, plus "latest" unless the release is marked
      # as a prerelease. Manual runs get a placeholder tag and are not pushed.
      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/dominykasvad/${{ matrix.image }}
          tags: |
            type=raw,value=${{ github.event.release.tag_name }},enable=${{ github.event_name == 'release' }}
            type=raw,value=latest,enable=${{ github.event_name == 'release' && !github.event.release.prerelease }}
            type=raw,value=dry-run,enable=${{ github.event_name != 'release' }}

      - name: Build date
        id: date
        run: echo "now=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_OUTPUT"

      - name: Build and push (push only on release)
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          target: release
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name == 'release' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            BUILD_INFO=${{ github.event.release.tag_name || github.sha }}
            BUILD_DATE=${{ steps.date.outputs.now }}
            SOURCE_COMMIT=${{ github.sha }}
            DOCKER_REPO=ghcr.io/dominykasvad/${{ matrix.image }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
