name: CI
on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server:
    name: Server (lint, types, tests)
    # A push to a branch of this repository already runs CI; run on
    # pull_request only for forks, so the same commit is not checked twice.
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30

    env:
      LITHICA_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5433/postgres

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.0
        with:
          enable-cache: true
          cache-dependency-glob: server/uv.lock

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Install dependencies
        run: uv sync --frozen

      - name: Lint
        run: uv run ruff check --output-format=github .

      - name: Check formatting
        run: uv run ruff format --check .

      # Report only until phase 1.5 brings the count to zero.
      - name: Type check (report only)
        run: |
          uv run pyright > pyright.log || true
          tail -n 1 pyright.log
          {
            echo "### pyright (report only)"
            tail -n 1 pyright.log
          } >> "$GITHUB_STEP_SUMMARY"

      # No raw SQL and nothing PostgreSQL-only in the engine (AGENTS.md,
      # "Database"). Also part of the suite; run first so it is visible.
      - name: Database portability gate
        run: uv run pytest --color=yes lithica/tests/test_portability.py

      - name: Test
        run: uv run pytest -n auto --color=yes
