repos:

-   repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.4.0
    hooks:
    -   id: trailing-whitespace
    -   id: end-of-file-fixer
    -   id: check-yaml
    -   id: mixed-line-ending


-   repo: https://github.com/Lucas-C/pre-commit-hooks
    rev: v1.4.2
    hooks:
    -   id: remove-tabs

-   repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.0
    hooks:
    -   id: ruff-check
        files: server/
        args: ['--fix']
    -   id: ruff-format
        files: server/

fail_fast: true
# legacy/ is frozen: hooks must not rewrite it
exclude: ^(LICENSE\.md|legacy/)
